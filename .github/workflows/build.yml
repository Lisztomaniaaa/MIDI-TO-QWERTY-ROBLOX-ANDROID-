name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install SDK components
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Grant execute permission
        run: chmod +x gradlew

      # ── DEBUG APK ──
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ── RELEASE APK ──
      - name: Check keystore secret
        id: keystore_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::KEYSTORE_BASE64 not set, building unsigned release."
          fi

      - name: Decode keystore
        id: decode_keystore
        if: steps.keystore_check.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d ' \t\r\n' \
            | sed 's|^data:[^,]*,||' \
            | base64 -d --ignore-garbage > "$KEYSTORE_PATH" 2>/tmp/b64err.log
          rc=$?
          if [ $rc -ne 0 ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::warning::Keystore decode failed, fallback to unsigned."
            rm -f "$KEYSTORE_PATH"
            echo "decoded=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          size=$(stat -c%s "$KEYSTORE_PATH")
          if [ "$size" -lt 256 ]; then
            echo "::warning::Keystore too small (${size} bytes), fallback to unsigned."
            rm -f "$KEYSTORE_PATH"
            echo "decoded=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "decoded=true" >> $GITHUB_OUTPUT

      - name: Build Release APK (signed)
        if: steps.decode_keystore.outputs.decoded == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build Release APK (unsigned fallback)
        if: steps.decode_keystore.outputs.decoded != 'true'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # ── PUBLISH TO GITHUB RELEASES ──
      - name: Rename APKs for release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/*.apk release-apks/Papiano-debug.apk || true
          cp app/build/outputs/apk/release/*.apk release-apks/Papiano-release.apk || true

      - name: Create/Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
          body: |
            ## Papiano APK - Auto Build

            Download APK di bawah ini dan install di Android kamu.

            **Debug APK** - untuk testing (tidak perlu keystore)
            **Release APK** - untuk production (signed jika keystore tersedia)

            ---
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: release-apks/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always() && steps.keystore_check.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/keystore.jks"
